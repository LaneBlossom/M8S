<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style>
</head>
<body>
<title>M8S 時間軸小抄 1號小隊尊爵不凡VIP專用</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: vertical timeline rail; role views lift that role's casts out (gold = team mit, teal = personal), everything else muted */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --fg:#1b2030; --muted:#6a7189; --line:#dde0ea;
  --st:#b8860b; --st-bg:#fff4d6; --st-fg:#5a3f00; --st-ring:#e7b93c;
  --self:#0f7a6c; --self-bg:#dcf3ef; --self-fg:#0b4a42;
  --mt:#2f5fb8; --dps:#8a4fb0; --warn:#c0392b; --warn-bg:#fdecea;
  --chip:#eef0f6; --on-badge:#ffffff;
  --p1:#d0612a; --p2:#1f8fc4; --p3:#c23b7e; --p4:#5a8f2e;
  --f-disp:"Chakra Petch","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --panel:#1b1e29; --fg:#e8eaf2; --muted:#9097ad; --line:#2c3040;
  --st:#f2c14e; --st-bg:#3a2e0d; --st-fg:#ffe7a6; --st-ring:#c99a2a;
  --self:#4fd1bd; --self-bg:#123631; --self-fg:#b8f1e7;
  --mt:#7fa6ee; --dps:#c49be0; --warn:#ff7b6b; --warn-bg:#3a1c1a; --chip:#252938; --on-badge:#12141c; --p1:#f08a52; --p2:#5cbcea; --p3:#ec6fae; --p4:#93c85f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --panel:#1b1e29; --fg:#e8eaf2; --muted:#9097ad; --line:#2c3040;
  --st:#f2c14e; --st-bg:#3a2e0d; --st-fg:#ffe7a6; --st-ring:#c99a2a;
  --self:#4fd1bd; --self-bg:#123631; --self-fg:#b8f1e7;
  --mt:#7fa6ee; --dps:#c49be0; --warn:#ff7b6b; --warn-bg:#3a1c1a; --chip:#252938; --on-badge:#12141c; --p1:#f08a52; --p2:#5cbcea; --p3:#ec6fae; --p4:#93c85f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--f-disp);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(24px,5vw,34px);margin:2px 0 4px;text-wrap:balance}
h1 span{color:var(--st)}
h1 .vip{font-style:normal;font-size:.55em;font-weight:700;vertical-align:.25em;padding:2px 10px;border-radius:6px;background:var(--st);color:var(--on-badge);letter-spacing:.04em;white-space:nowrap}
.sub{color:var(--muted);font-size:14px;margin:0}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar .lbl{font-size:12px;color:var(--muted);min-width:34px;letter-spacing:.08em}
.bar button{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--st-bg);border-color:var(--st-ring);color:var(--st-fg);font-weight:700}
.bar button:focus-visible{outline:2px solid var(--st);outline-offset:2px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* role summary */
.mine{background:var(--panel);border:1px solid var(--st-ring);border-radius:12px;padding:16px}
.mine h2{font-family:var(--f-disp);font-size:16px;margin:0 0 6px;color:var(--st)}
.mine p.lead{font-size:13px;color:var(--muted);margin:0 0 12px}
.mine h3{font-family:var(--f-disp);font-size:12px;letter-spacing:.12em;color:var(--muted);margin:14px 0 8px;font-weight:600}
.mine h3:first-of-type{margin-top:0}
.mine ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 18px}
.mine li{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:14px;min-width:0}
.mine time{font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums;color:var(--st)}
.mine .what{min-width:0;display:flex;flex-direction:column;gap:2px}
.mine .what small{font-size:12px;color:var(--muted);line-height:1.4}
.mine .acts{display:flex;flex-wrap:wrap;gap:4px 8px}
.act{font-weight:700}
.act.team{color:var(--st)} .act.self{color:var(--self)}
.cds{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.cds b{color:var(--fg);font-weight:600}

/* timeline */
.tl{display:flex;flex-direction:column;gap:18px}
.part{font-family:var(--f-disp);font-weight:700;font-size:22px;padding:10px 16px;background:var(--st-bg);color:var(--st-fg);border-left:6px solid var(--st);border-radius:8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0;column-span:all}
.part:not(:first-child){margin-top:18px}
.part small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--st-fg);opacity:.8}
.group{display:flex;flex-direction:column;gap:2px}
.gtitle.pstart{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:none;color:var(--fg);padding:14px 0 8px;margin-top:6px;border-top:3px solid var(--pc,var(--muted))}
.gtitle.p1{--pc:var(--p1)} .gtitle.p2{--pc:var(--p2)} .gtitle.p3{--pc:var(--p3)} .gtitle.p4{--pc:var(--p4)}
.gtitle.pstart{color:var(--pc)}
.gtitle .pn{font-family:var(--f-disp);font-size:14px;font-weight:700;letter-spacing:.06em;background:var(--pc,var(--fg));color:var(--on-badge);padding:2px 9px;border-radius:5px}
.part + .group .gtitle.pstart{border-top:0;margin-top:0;padding-top:4px}
.gtitle{font-family:var(--f-disp);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 0 6px 2px}
.row{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.row.hit{border-color:var(--st-ring);box-shadow:inset 4px 0 0 var(--st)}
.row time{font-family:var(--f-disp);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px}
.row.hit time{color:var(--st)}
.body{min-width:0;display:flex;flex-direction:column;gap:8px}
.mech{font-weight:700;font-size:15px}
.row.quiet .mech{font-weight:500;color:var(--muted)}
.hint{font-weight:500}
.press{display:inline-block;margin-left:8px;font-family:var(--f-disp);font-weight:600;font-size:12px;color:var(--st);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px 3px 4px;border-radius:6px;background:var(--chip);color:var(--fg)}
.chip .r{font-family:var(--f-disp);font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px;color:var(--on-badge)}
.r.MT{background:var(--mt)} .r.ST{background:var(--st)} .r.D1,.r.D2,.r.D3,.r.D4{background:var(--dps)}
.chip.mine-team{background:var(--st-bg);color:var(--st-fg);font-weight:700;box-shadow:0 0 0 1.5px var(--st-ring)}
.chip.mine-team .r{background:var(--st);color:var(--on-badge)}
.chip.mine-self{background:var(--self-bg);color:var(--self-fg);font-weight:700;box-shadow:0 0 0 1.5px var(--self)}
.chip.mine-self .r{background:var(--self);color:var(--on-badge)}
body:not([data-role="team"]) .chip.other{opacity:.55}
.pos{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--fg)}
.pos .pk{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--p2);color:var(--on-badge)}
.rules{font-size:13px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--p2);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.rules b{color:var(--p2)}
.note{font-size:13px;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)}
.note.role{border-left-color:var(--self);color:var(--fg)}
.warnbox{font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:8px}
.endnote{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:0}
.empty{font-size:13px;color:var(--muted)}

/* compact view: one line per mechanic, multi-column on wide screens for a side monitor */
body.compact .wrap{max-width:1500px;padding-block:12px 24px;gap:10px}
body.compact header .sub,body.compact .mine,body.compact .endnote,body.compact .note,body.compact .warnbox{display:none!important}
body.compact header .eyebrow{display:none}
body.compact h1{font-size:20px;margin:0}
body.compact .controls{padding-block:6px;gap:6px 22px;flex-direction:row;flex-wrap:wrap;align-items:center}
body.compact .bar .lbl{min-width:0}
body.compact .bar button{padding:3px 10px;font-size:12px}
body.compact .tl{display:block;columns:3 400px;column-gap:32px}
body.compact .part{font-size:18px;padding:6px 14px;margin:0 0 8px;break-after:avoid}
body.compact .part:not(:first-child){margin-top:16px}
body.compact .group{gap:0;margin-bottom:8px}
body.compact .gtitle{font-size:12px;padding:6px 0 2px;break-after:avoid}
body.compact .gtitle.pstart{font-size:15px;padding:10px 0 6px;margin-top:4px}
body.compact .row{grid-template-columns:54px 1fr;gap:10px;padding:5px 8px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;box-shadow:none;break-inside:avoid}
body.compact .row.hit{background:var(--panel);box-shadow:inset 3px 0 0 var(--st)}
body.compact .row time{font-size:17px;padding-top:0}
body.compact .body{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
body.compact .mech{font-size:17px;font-weight:700}
body.compact .row.quiet .mech{font-weight:500}
body.compact .press{display:none}
body.compact .rules{display:none}
body.compact .pos{font-size:13px;font-weight:500;flex-basis:100%;gap:6px}
body.compact .pos .pk{font-size:10px;padding:0 5px}

body.compact .chips{gap:3px}
body.compact .chip{font-size:14px;padding:1px 7px 1px 3px;gap:5px}
body.compact .chip .r{font-size:11px;padding:0 5px}

@media (max-width:480px){.row{grid-template-columns:48px 1fr;gap:10px;padding:10px}.row time{font-size:15px}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">AAC Cruiserweight M4 Savage · 呼嘯之劍 · 門神＋本體</div>
    <h1>M8S 時間軸小抄 <em class="vip">1號小隊尊爵不凡VIP專用</em> <span id="h-role">· 全隊</span></h1>
    <p class="sub">每一行的時間是 Boss 技能的判定時間，「軸 xx:xx 按」是隊伍排的按鍵時間。圈數字是這招第幾次出現。門神狼頭之後的時間會隨狼打多快前後差幾秒。</p>
  </header>

  <div class="controls">
    <div class="bar" role="group" aria-label="看誰的">
      <span class="lbl">職責</span>
      <button id="r-team" data-role="team" aria-pressed="true">全隊</button>
      <button id="r-st" data-role="st" aria-pressed="false">ST 騎士</button>
      <button id="r-mt" data-role="mt" aria-pressed="false">MT 絕槍</button>
      <button id="r-d1" data-role="d1" aria-pressed="false">D1 武僧</button>
      <button id="r-d2" data-role="d2" aria-pressed="false">D2 武士</button>
      <button id="r-d3" data-role="d3" aria-pressed="false">D3 舞者</button>
      <button id="r-d4" data-role="d4" aria-pressed="false">D4 召喚</button>

    <div class="bar" role="group" aria-label="顯示範圍">
      <span class="lbl">顯示</span>
      <button id="m-all" data-mode="all" aria-pressed="true">完整機制</button>
      <button id="m-mit" data-mode="mit" aria-pressed="false">只看要按減傷的</button>
    </div>
    <div class="bar" role="group" aria-label="範圍">
      <span class="lbl">範圍</span>
      <button id="s-all" data-span="all" aria-pressed="true">全部</button>
      <button id="s-1" data-span="1" aria-pressed="false">前半 · 門神</button>
      <button id="s-2" data-span="2" aria-pressed="false">後半 · 本體</button>
    </div>
    <div class="bar" role="group" aria-label="版面">
      <span class="lbl">版面</span>
      <button id="v-full" data-view="full" aria-pressed="true">詳細</button>
      <button id="v-compact" data-view="compact" aria-pressed="false">精簡（副螢幕）</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <section class="mine" id="mine" hidden aria-labelledby="mine-h">
    <h2 id="mine-h"></h2>
    <p class="lead" id="mine-lead"></p>
    <div id="mine-list"></div>
    <div class="cds" id="cds"></div>
  </section>

  <main class="tl" id="tl"></main>

  <p class="endnote">時間照 cactbot 的 M8S 時間軸換算，對齊隊伍軸的時間。技能名稱照 xivstrat 的前半、後半攻略。</p>
</div>

 "≈04:08":"狼狂暴","01:06":"千年風化","01:17":"暴風 ① → 狂風 ×2＋千年風嘯","01:32":"暴風 ② → 風狼陣（踩塔）","02:18":"大地的呼喚 → 斬空劍 → 十字光牙",
 "04:49":"大震擊 ① → 殘影劍＋突進光牙（斜斜的）","05:52":"大震擊 ③ → 幻狼劍 ×4","05:40":"幻狼召喚",
 "07:46":"爆震 ①","07:58":"魔光 ①＋閃光炮","08:09":"雙牙擊 ①（雙 T 死刑）","08:21":"鎧袖一觸 ①","08:31":"魔光 ②＋閃光炮","08:56":"剛刃一閃 ①（炸平台）",
 "09:03":"風震魔印（雙 T 死刑＋分攤）","09:13":"風狼陣","09:33":"雙牙暴風擊 ①","10:15":"回天動地 ×5＋閃光炮",
 "10:57":"魔光 ③＋閃光炮","11:08":"雙牙擊 ②（雙 T 死刑）","11:28":"獨狼的詛咒","11:38":"風狼陣（踩塔）","12:09":"魔光 ④＋閃光炮",
 "12:23":"八連光彈 ①（全員分攤）","12:43":"八連光彈 ②（MT 無敵）","13:03":"八連光彈 ③（ST 無敵）","13:22":"八連光彈 ④（雙 T 分攤）","13:42":"八連光彈 ⑤（全員分攤）",
 "13:49":"剛刃一閃・終 → 14:00 狂暴"};
const HINTS=[["爆震","44分攤"],["鎧袖一觸","半場刀＋鋼鐵月環"],["魔光","排隊 T近遠奶"],["雙牙暴風擊","二二分組 分攤＋引導"],["回天動地","側中前後前"],["獨狼的詛咒","遠、近線"],["幻狼召喚","看半場刀"]];
const HINT_T={"09:13":["二二踩塔"]};
function hintsOf(r){return HINTS.filter(([k])=>r.m.includes(k)).map(x=>x[1]).concat(HINT_T[r.t]||[])}
function shortName(r){return SHORT[r.t]||r.m.replace(/（[^）]{7,}）/g,"")}
function renderTimeline(){
  const tl=document.getElementById("tl"); tl.textContent="";
  const R=role.toUpperCase();
  let pi=0, lastP="";
  for(const grp of data){
    if(grp.part){pi++;lastP=""}
    if(span!=="all"&&String(pi)!==span) continue;
    if(grp.part){const hh=el("h2","part",grp.part);if(grp.sub)hh.append(el("small",null,grp.sub));tl.append(hh)}
    const rows=grp.rows.filter(r=>mode==="all"||relevant(r));
    if(!rows.length) continue;
    const g=el("section","group");
    const pn=grp.g.split(" ")[0], rest=grp.g.slice(pn.length+1);
    const newP=pn!==lastP||!!grp.cut; lastP=pn;
    const gt=el("div","gtitle"+(newP?" pstart "+pn.toLowerCase():""));
    if(newP){gt.append(el("span","pn",pn),document.createTextNode(rest))} else gt.textContent=grp.g;
    g.append(gt);
    if(grp.rules){const rb=el("div","rules");rb.innerHTML=grp.rules;g.append(rb)}
    if(grp.warn) g.append(el("div","warnbox",grp.warn));
    for(const r of rows){
      const rel=relevant(r);
      const row=el("div","row"+(rel?" hit":" quiet"));
      row.append(el("time",null,r.t));
      const b=el("div","body");
      const mh=el("div","mech",view==="compact"?shortName(r):r.m); for(const h of hintsOf(r)) mh.append(el("span","hint","（"+h+"）"));
      if(r.press && (role==="team"?r.c.length:myTeam(r).length)) mh.append(el("span","press","軸 "+r.press+" 按"));
      b.append(mh);
      const chips=el("div","chips");
      const sorted=[...r.c].sort((a,b)=>(b[0]===R)-(a[0]===R));
      for(const [who,sk] of sorted){
        const mine=role!=="team"&&who===R;
        const ch=el("span","chip "+(role==="team"?"":(mine?"mine-team":"other")));
        ch.append(el("span","r "+who,mine?"我":RN[who]),document.createTextNode(sk));
        chips.append(ch);
      }
      for(const sk of mySelf(r)){const ch=el("span","chip mine-self");ch.append(el("span","r","個人"),document.createTextNode(sk));chips.append(ch)}
      if(chips.children.length) b.append(chips);
      if(r.pos){const pp=el("div","pos");pp.append(el("span","pk","站位"),document.createTextNode(r.pos));b.append(pp)}
      if(r.n) b.append(el("div","note",r.n));
      const rn=role==="st"?r.nst:role==="mt"?r.nmt:null;
      if(rn) b.append(el("div","note role",rn));
      row.append(b); g.append(row);
    }
    tl.append(g);
  }
}

function renderMine(){
  const box=document.getElementById("mine");
  if(role==="team"){box.hidden=true;return}
  box.hidden=false;
  const cfg=roles[role];
  document.getElementById("mine-h").textContent=cfg.title;
  document.getElementById("mine-lead").textContent=cfg.lead;
  const list=document.getElementById("mine-list"); list.textContent="";
  let ol=null;
  let pi=0;
  for(const grp of data){
    if(grp.part) pi++;
    if(span!=="all"&&String(pi)!==span) continue;
    if(grp.part){list.append(el("h3",null,grp.part));ol=el("ol");list.append(ol)}
    for(const r of grp.rows){
      const tm=myTeam(r), sf=mySelf(r);
      if(!tm.length&&!sf.length) continue;
      const li=el("li");
      li.append(el("time",null,(tm.length&&r.press)?r.press:r.t));
      const w=el("div","what");
      const acts=el("div","acts");
      if(tm.length) acts.append(el("span","act team",tm.map(x=>x[1]).join("＋")));
      if(sf.length) acts.append(el("span","act self",sf.join("＋")));
      w.append(acts, el("small",null,r.m));
      li.append(w); ol.append(li);
    }
  }
  const cds=document.getElementById("cds"); cds.textContent="";
  for(const line of cfg.cds){const d=el("div");d.innerHTML=line;cds.append(d)}
}

function renderLegend(){
  const lg=document.getElementById("legend"); lg.textContent="";
  const add=(style,txt)=>{const s=el("span");const i=el("i");i.style.cssText=style;s.append(i,document.createTextNode(txt));lg.append(s)};
  if(role==="team"){
    add("background:var(--mt)","MT");add("background:var(--st)","ST");add("background:var(--dps)","DPS");
    lg.append(el("span",null,"只列團減，不含坦克個人減傷"));
  }else{
    add("background:var(--st)","我的團減");if(role==="st"||role==="mt")add("background:var(--self)","我的個人減傷");add("background:var(--chip);box-shadow:0 0 0 1px var(--line) inset","其他人的團減");
  }
}

function render(){
  document.body.dataset.role=role;
  document.body.classList.toggle("compact",view==="compact");
  for(const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-pressed",b.dataset.view===view);
  for(const b of document.querySelectorAll("[data-span]")) b.setAttribute("aria-pressed",b.dataset.span===span);
  document.getElementById("h-role").textContent=roles[role].h;
  for(const b of document.querySelectorAll("[data-role]")) if(b.tagName==="BUTTON") b.setAttribute("aria-pressed",b.dataset.role===role);
  for(const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed",b.dataset.mode===mode);
  document.getElementById("m-mit").textContent=role==="team"?"只看要下團減的":"只看我要按的";
  renderLegend(); renderMine(); renderTimeline();
  try{localStorage.setItem("m8s-role",role);localStorage.setItem("m8s-mode",mode);localStorage.setItem("m8s-view",view);localStorage.setItem("m8s-span",span)}catch(e){}
}
for(const b of document.querySelectorAll("button[data-role]")) b.onclick=()=>{role=b.dataset.role;render()};
for(const b of document.querySelectorAll("button[data-mode]")) b.onclick=()=>{mode=b.dataset.mode;render()};
for(const b of document.querySelectorAll("button[data-view]")) b.onclick=()=>{view=b.dataset.view;render()};
for(const b of document.querySelectorAll("button[data-span]")) b.onclick=()=>{span=b.dataset.span;render()};
render();
</script>
